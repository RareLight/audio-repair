name: CPU unit tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that local files are excluded
        run: |
          ignored=$(git ls-files --cached --ignored --exclude-standard)
          if [ -n "$ignored" ]; then
            printf 'Tracked files matched by .gitignore:\n%s\n' "$ignored"
            exit 1
          fi
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements/macos-arm64.txt
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 huggingface-hub==1.27.0 soundfile==0.14.0
      - name: Compile and run unit tests
        env:
          HF_HUB_OFFLINE: "1"
        run: |
          python -m compileall -q inference.py audio_repair tests
          python -m unittest discover -s tests -v
