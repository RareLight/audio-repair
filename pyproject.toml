[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-repair"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy==1.26.4", "soundfile==0.14.0", "huggingface-hub==1.27.0", "torch==2.11.0"]

[project.scripts]
audio-repair = "audio_repair.cli:main"

[tool.setuptools]
py-modules = ["inference"]

[tool.setuptools.packages.find]
include = ["audio_repair", "look2hear.models*"]
